name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r App/python/requirements.txt pyinstaller

      - name: Build backend executable
        run: python -m PyInstaller --onefile --noconfirm --name hipot-backend-x86_64-pc-windows-msvc backend_entry.py

      - name: Copy backend sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri/binaries | Out-Null
          Copy-Item dist/hipot-backend-x86_64-pc-windows-msvc.exe tauri/binaries/hipot-backend-x86_64-pc-windows-msvc.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "HiPotApp ${{ github.ref_name }}"
          releaseBody: |
            ## Cambios

            Ver RELEASE_NOTES.md para detalles completos.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc