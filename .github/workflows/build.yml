name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r App/python/requirements.txt pyinstaller

      - name: Build backend executable
        run: python -m PyInstaller --onefile --noconfirm --name hipot-backend-x86_64-pc-windows-msvc backend_entry.py

      - name: Copy backend sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri/binaries | Out-Null
          Copy-Item dist/hipot-backend-x86_64-pc-windows-msvc.exe tauri/binaries/hipot-backend-x86_64-pc-windows-msvc.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: tauri

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri app
        working-directory: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Ensure updater signature exists
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $sigFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe.sig" | Select-Object -First 1
          if (-not $sigFile) {
            Write-Host "No signature found, signing manually..."
            $exeFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe" | Select-Object -First 1
            if (-not $exeFile) { throw "Installer not found for version $version" }
            $cli = "tauri/node_modules/.bin/tauri.cmd"
            if (-not (Test-Path $cli)) { throw "Tauri CLI not found at $cli" }
            & $cli signer sign $exeFile.FullName
            $sigFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe.sig" | Select-Object -First 1
          }
          if (-not $sigFile) { throw "Signature not found for version $version" }
          Write-Host "Signature: $($sigFile.FullName)"

      - name: Generate latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $sigFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "Signature not found for version $version" }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $url = "https://github.com/hector1516/HiPotApp/releases/download/$tag/HiPotApp_${version}_x64-setup.exe"
          $latest = @{
            version = $version
            notes = "Release $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 6
          $latest | Set-Content -Path "latest.json" -Encoding UTF8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $exeFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path "tauri/src-tauri/target" -Recurse -Filter "HiPotApp_${version}_x64-setup.exe.sig" | Select-Object -First 1
          if (-not $exeFile) { throw "Installer not found" }
          if (-not $sigFile) { throw "Signature not found" }
          $releaseExists = $false
          gh release view $tag --repo hector1516/HiPotApp *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if (-not $releaseExists) {
            gh release create $tag $exeFile.FullName $sigFile.FullName latest.json --title "HiPotApp $tag" --notes "Release $tag" --repo hector1516/HiPotApp
          } else {
            gh release upload $tag $exeFile.FullName $sigFile.FullName latest.json --clobber --repo hector1516/HiPotApp
          }